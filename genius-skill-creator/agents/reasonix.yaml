runtime: "reasonix"
display_name: "Genius Skill Creator"
description: "Reasonix adapter for creating, repairing, auditing, evaluating, and optimizing skill packages."
run_as: "subagent"
model: "deepseek-v4-pro"
allowed_tools:
  - read_file
  - search_content
  - search_files
  - directory_tree
  - get_file_info
  - glob
  - write_file
  - run_command
  - web_search
  - web_fetch
usage:
  default_prompt: "Use genius-skill-creator to optimize a skill package against the Skill Hub template."
  shared_instructions:
    - "../SKILL.md"
    - "../references/skill-optimization-template.md"
    - "../references/agent-adapter-standard.md"
    - "../references/eval-workflow.md"
  output_contract: "Report requirement summary, files changed, adapter status, validation results, and remaining risks."
