runtime: "trae-solo"
display_name: "Genius Skill Creator"
description: "Trae IDE / Trae SOLO adapter for porting skill packages as native Trae Skills, project rules, or custom instructions."
integration_style:
  - "native-skill"
  - "project-rule"
  - "user-rule"
  - "custom-instruction"
capability_status:
  native_skill_package: "verified — Trae supports native SKILL.md with YAML frontmatter (name + description) under .trae/skills/ (project) or ~/.trae-cn/skills/ (global)"
  skill_format: "SKILL.md with YAML frontmatter containing name and description, plus markdown body with instructions; subdirectories examples/, templates/, resources/ are supported"
  skill_discovery: "on-demand — agent scans all skill descriptions first, loads full SKILL.md only when task matches"
  skill_creation: "AI conversation, manual UI, or .zip import"
  agents_skills_compat: "verified — .agents/skills/ directory supported for Agent Skills ecosystem compatibility"
  rules_system: "user_rules.md (global, all projects), project_rules.md (project-level, .trae/rules/); rules load fully per conversation, 20000 byte limit; priority: user input > custom agent prompt > user_rules.md > project_rules.md"
  mcp_support: "verified — MCP servers configurable alongside skills"
  tool_names: "use Trae IDE built-in tools (file read/write, terminal, search, apply); do not invent tool names"
  command_execution: "through Trae IDE terminal panel; Python, Node, shell commands supported"
  docs_basis: "Trae IDE Skills docs: native SKILL.md format, on-demand loading, global/project scoping, .agents/ compatibility, zip import/export. Trae Rules docs: user_rules.md, project_rules.md, priority chain."
  docs_url_skill: "https://docs.trae.cn/ide/skills"
  docs_url_rules: "https://docs.trae.cn/ide/rules"
  docs_url_solo: "https://docs.trae.cn/solo/what-is-trae-solo"
skill_deployment:
  project_path: ".trae/skills/<skill-name>/SKILL.md"
  global_path_windows: "%USERPROFILE%/.trae-cn/skills/<skill-name>/SKILL.md"
  global_path_unix: "~/.trae-cn/skills/<skill-name>/SKILL.md"
  agents_compat_path: ".agents/skills/<skill-name>/SKILL.md"
  config_file: ".trae/skills-config.json"
  supported_subdirs:
    - "examples/"
    - "templates/"
    - "resources/"
    - "references/"
    - "scripts/"
    - "assets/"
usage:
  default_prompt: "Use genius-skill-creator to port or optimize a skill package for Trae IDE or Trae SOLO as a native Trae Skill with SKILL.md under .trae/skills/ or ~/.trae-cn/skills/."
  porting_strategy: |
    1. Keep SKILL.md frontmatter with name and description (Trae uses description for on-demand skill matching).
    2. Move detailed guidance into subdirectories (references/, resources/, examples/) — Trae supports them natively.
    3. Keep scripts deterministic and portable — Trae IDE has terminal access for running scripts.
    4. For project rules, generate a project_rules.md snippet from the skill's non-negotiable rules.
    5. For global skills, deploy to ~/.trae-cn/skills/<name>/SKILL.md so it works across all projects.
    6. Trae SKILL.md format is compatible with Codex SKILL.md format — frontmatter fields (name, description) are the same.
    7. Trae also supports .agents/skills/ for ecosystem compatibility with Agent Skills standard.
    8. Subdirectories like examples/, templates/, resources/ are supported but optional — use only when the skill needs them.
  shared_instructions:
    - "../SKILL.md"
    - "../references/skill-optimization-template.md"
    - "../references/agent-adapter-standard.md"
    - "../references/cross-platform-command-standard.md"
    - "../references/eval-workflow.md"
  output_contract: "Return requirement summary, Trae skill type (project/global/agents-compat), deployment path, files changed, validation results, and Windows/macOS/Linux command status."
