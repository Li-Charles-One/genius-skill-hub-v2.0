runtime: zcode
install_path: ~/.zcode/skills/x-search-grok
invoke: /x-search-grok or automatic trigger from description
tools:
  - Bash
  - Read
  - Write
notes:
  - Run scripts/x_search.py for deterministic X search.
  - Config via CLI args, env, or skill .env.
  - Default model grok-4.5 across all channels.
  - Multi-channel failover via channels.json priority registry.
  - Swap providers by priority/enabled; secrets stay in .env.
  - V1 modes only: keyword, account, heat.
