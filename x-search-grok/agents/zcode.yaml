runtime: zcode
install_path: ~/.zcode/skills/x-search-grok
invoke: /x-search-grok or automatic trigger from description
tools:
  - Bash
  - Read
  - Write
notes:
  - Run scripts/x_search.py for deterministic X search.
  - Config via env, skill .env, or workspace probe_key.txt / probe_env.txt.
  - Primary model grok-4.5 with automatic fallback to grok-4.3.
  - V1 modes only: keyword, account, heat.
