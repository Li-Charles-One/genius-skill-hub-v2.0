name: validate

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate skill metadata
        run: |
          python - <<'PY'
          from pathlib import Path

          skills = sorted(Path(".").glob("**/SKILL.md"))
          if not skills:
              raise SystemExit("No SKILL.md files found")
          for skill in skills:
              text = skill.read_text(encoding="utf-8")
              if not text.startswith("---\n"):
                  raise SystemExit(f"{skill}: missing YAML frontmatter")
              end = text.find("\n---", 4)
              if end == -1:
                  raise SystemExit(f"{skill}: frontmatter not closed")
              frontmatter = text[4:end]
              for key in ("name:", "description:"):
                  if key not in frontmatter:
                      raise SystemExit(f"{skill}: missing {key}")
              print(f"valid metadata: {skill}")
          PY

      - name: Validate agent metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          for file in sorted(Path(".").glob("**/agents/*.yaml")):
              data = yaml.safe_load(file.read_text(encoding="utf-8"))
              if not isinstance(data, dict):
                  raise SystemExit(f"{file}: YAML root must be a mapping")
              print(f"valid agent metadata: {file}")
          PY

      - name: Validate Genius Skill Creator package
        run: |
          python genius-skill-creator/scripts/quick_validate.py genius-skill-creator --hub .
          python genius-skill-creator/scripts/validate_evals.py genius-skill-creator/evals/evals.json

      - name: Check WePlaning scripts syntax
        run: |
          find we-planing/scripts -name '*.cjs' -print0 | xargs -0 -n1 node --check
          find we-planing/tools -name '*.cjs' -print0 | xargs -0 -n1 node --check

      - name: Smoke test WePlaning lifecycle
        run: |
          set -euo pipefail
          node we-planing/tools/smoke-weplaning.cjs

