name: validate

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate skill metadata
        run: |
          python - <<'PY'
          from pathlib import Path

          skills = sorted(Path(".").glob("**/SKILL.md"))
          if not skills:
              raise SystemExit("No SKILL.md files found")
          for skill in skills:
              text = skill.read_text(encoding="utf-8")
              if not text.startswith("---\n"):
                  raise SystemExit(f"{skill}: missing YAML frontmatter")
              end = text.find("\n---", 4)
              if end == -1:
                  raise SystemExit(f"{skill}: frontmatter not closed")
              frontmatter = text[4:end]
              for key in ("name:", "description:"):
                  if key not in frontmatter:
                      raise SystemExit(f"{skill}: missing {key}")
              print(f"valid metadata: {skill}")
          PY

      - name: Validate agent metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          for file in sorted(Path(".").glob("**/agents/*.yaml")):
              data = yaml.safe_load(file.read_text(encoding="utf-8"))
              if not isinstance(data, dict):
                  raise SystemExit(f"{file}: YAML root must be a mapping")
              print(f"valid agent metadata: {file}")
          PY

      - name: Validate Genius Skill Creator package
        run: |
          python genius-skill-creator/scripts/quick_validate.py genius-skill-creator --hub .
          python genius-skill-creator/scripts/validate_evals.py genius-skill-creator/evals/evals.json

      - name: Smoke test code audit report validator
        run: |
          set -euo pipefail
          node --check genius-code-audit/scripts/validate-audit-report.cjs
          report="$(mktemp)"
          python - "$report" <<'PY'
          import sys
          from pathlib import Path

          report = Path(sys.argv[1])
          template = Path("genius-code-audit/assets/audit-report-template.html").read_text(encoding="utf-8")
          values = {
              "{{PROJECT_NAME}}": "ci-sample",
              "{{AUDIT_DATE}}": "2026-06-04",
              "{{AUDIT_MODE}}": "diff",
              "{{AUDIT_SCOPE}}": "Diff: origin/main..HEAD",
              "{{TOTAL_ISSUES}}": "1",
              "{{FATAL_COUNT}}": "0",
              "{{SEVERE_COUNT}}": "0",
              "{{FIX_COUNT}}": "1",
              "{{SUGGEST_COUNT}}": "0",
              "{{ARCH_COUNT}}": "0",
              "{{FATAL_PCT}}": "0",
              "{{SEVERE_PCT}}": "0",
              "{{FIX_PCT}}": "100",
              "{{SUGGEST_PCT}}": "0",
              "{{ARCH_PCT}}": "0",
              "{{FILE_DISTRIBUTION_ROWS}}": "<tr><td class=\"file-col\">src/app.ts</td><td>1</td></tr>",
              "{{FATAL_ISSUES}}": "",
              "{{SEVERE_ISSUES}}": "",
              "{{FIX_ISSUES}}": "<div class=\"issue fix\"><div class=\"issue-header\"><span class=\"severity severity-fix\">FIX</span><span class=\"issue-title\">Sample issue</span><span class=\"file\">src/app.ts:1</span></div><div class=\"issue-body\"><div class=\"code-block\"><pre>sample</pre></div><p><strong>Problem:</strong> Sample problem.</p><p><strong>Fix:</strong> Sample fix.</p></div></div>",
              "{{SUGGEST_ISSUES}}": "",
              "{{ARCHITECTURE_SECTION}}": "",
              "{{ARCH_SUMMARY_ROW}}": "",
              "{{SUMMARY_VERDICT}}": "<p>One issue found.</p>",
              "{{CLOSING_QUOTE}}": "Fix the bug.",
          }
          for key, value in values.items():
              template = template.replace(key, value)
          report.write_text(template, encoding="utf-8")
          PY
          node genius-code-audit/scripts/validate-audit-report.cjs "$report"

      - name: Check WePlaning scripts syntax
        run: |
          find we-planing/scripts -name '*.cjs' -print0 | xargs -0 -n1 node --check
          find we-planing/tools -name '*.cjs' -print0 | xargs -0 -n1 node --check

      - name: Smoke test WePlaning lifecycle
        run: |
          set -euo pipefail
          node we-planing/tools/smoke-weplaning.cjs

      - name: Smoke test WePlaning repair
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          scripts="we-planing/scripts"

          session="$(node "$scripts/init-memory.cjs" "$root" --project "CI Repair" --goal "Validate repair" --agent CI --adapter GitHubActions --os linux | tail -n1)"
          rm "$root/.agent-memory/sessions/$session.md"
          node "$scripts/repair-memory.cjs" "$root" --dry-run
          node "$scripts/repair-memory.cjs" "$root"
          node "$scripts/check-memory.cjs" "$root"

      - name: Smoke test WePlaning semantic audit
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          scripts="we-planing/scripts"

          session="$(node "$scripts/init-memory.cjs" "$root" --project "CI Audit" --goal "Validate semantic audit" --agent CI --adapter GitHubActions --os linux | tail -n1)"
          node "$scripts/check-memory.cjs" "$root" --audit

          python - "$root" <<'PY'
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          current = root / ".agent-memory" / "CURRENT.md"
          text = current.read_text(encoding="utf-8")
          text = text.replace("## Open Blockers\nnone\n\n## Based On", "## Open Blockers\n- none\n- Needs manual browser authorization.\n\n## Based On")
          current.write_text(text, encoding="utf-8")
          PY

          if node "$scripts/check-memory.cjs" "$root" --audit; then
            echo "Expected semantic audit to fail on blocker drift"
            exit 1
          fi
