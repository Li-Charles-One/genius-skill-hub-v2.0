runtime: "reasonix"
display_name: "Genius-WePlaning"
description: "Reasonix adapter for Genius-WePlaning 3.0 project memory. Run bundled Node scripts; do not hand-edit .agent-memory."
run_as: "subagent"
model: "deepseek-v4-pro" # default; override per project when the Reasonix runtime supports it
allowed_tools:
  - read_file
  - write_file
  - edit_file
  - list_directory
  - run_command
usage:
  default_prompt: "Use genius-weplaning for .agent-memory init, read, write, or repair. CURRENT.md is truth."
  shared_instructions:
    - "../SKILL.md"
    - "../references/weplaning-v3.0-protocol.md"
    - "../references/cli.md"
    - "../references/pitfalls.md"
  output_contract: "Report whether anything persisted, check-memory result, and the exact next step. Never hand-edit .agent-memory files; always run the bundled scripts."
