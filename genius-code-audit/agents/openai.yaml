interface:
  display_name: "Genius Code Audit"
  short_description: "Linus Torvalds-style deep code audit — diff-based PR scan or full forensic review with HTML report"
  default_prompt: "Use $genius-code-audit to perform a brutal-honest code audit. Supports --mode diff (fast git-diff PR review) and --mode full (deep multi-file call-chain tracing). Outputs a self-contained dark-theme HTML report with severity-classified findings."