runtime: "reasonix"
display_name: "Genius Code Audit"
description: "Reasonix native adapter for diff-based and full code audits."
run_as: "subagent"
model: "deepseek-v4-pro"
allowed_tools:
  - read_file
  - search_content
  - search_files
  - directory_tree
  - get_file_info
  - get_symbols
  - glob
  - write_file
  - run_command
  - web_search
  - web_fetch

usage:
  default_prompt: "Use genius-code-audit in diff mode for PR-style review, or full mode for deep repository audit."
  report_output: "Save the self-contained HTML report to the workspace root."
  shared_instructions:
    - "../SKILL.md"
    - "../references/audit-workflow.md"
    - "../references/report-format.md"
  template: "../assets/audit-report-template.html"
