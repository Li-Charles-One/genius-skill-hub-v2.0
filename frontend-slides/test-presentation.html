<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontend Slides 测试演示</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* Viewport Base CSS - Fixed 16:9 Stage */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Mono', monospace;
            background: #0a0a0a;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .viewport-wrapper {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0a0a0a;
        }

        .presentation-stage {
            position: relative;
            width: 1920px;
            height: 1080px;
            transform-origin: center;
            background: #1a1a2e;
        }

        /* Responsive scaling */
        @media (max-aspect-ratio: 16/9) {
            .presentation-stage {
                width: 100vw;
                height: calc(100vw * 9 / 16);
            }
        }

        @media (min-aspect-ratio: 16/9) {
            .presentation-stage {
                width: calc(100vh * 16 / 9);
                height: 100vh;
            }
        }

        /* Slide base styles */
        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 1920px;
            height: 1080px;
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease, visibility 0.5s;
        }

        .slide.active {
            visibility: visible;
            opacity: 1;
            pointer-events: auto;
        }

        /* Creative Voltage Theme */
        .slide-1 {
            background: linear-gradient(135deg, #0066ff 0%, #0066ff 50%, #1a1a2e 50%, #1a1a2e 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .slide-1 .content {
            text-align: center;
            color: #ffffff;
        }

        .slide-1 h1 {
            font-family: 'Syne', sans-serif;
            font-size: 120px;
            font-weight: 800;
            margin-bottom: 40px;
            letter-spacing: -2px;
        }

        .slide-1 .subtitle {
            font-size: 32px;
            color: #d4ff00;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 4px;
        }

        .slide-2 {
            background: #1a1a2e;
            padding: 120px 160px;
        }

        .slide-2 h2 {
            font-family: 'Syne', sans-serif;
            font-size: 80px;
            font-weight: 700;
            color: #0066ff;
            margin-bottom: 60px;
        }

        .slide-2 ul {
            list-style: none;
        }

        .slide-2 li {
            font-size: 36px;
            color: #ffffff;
            margin-bottom: 40px;
            padding-left: 60px;
            position: relative;
        }

        .slide-2 li::before {
            content: "→";
            position: absolute;
            left: 0;
            color: #d4ff00;
            font-weight: 700;
        }

        .slide-3 {
            background: linear-gradient(135deg, #1a1a2e 0%, #0066ff 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .slide-3 .content {
            text-align: center;
            color: #ffffff;
        }

        .slide-3 h2 {
            font-family: 'Syne', sans-serif;
            font-size: 100px;
            font-weight: 800;
            margin-bottom: 40px;
        }

        .slide-3 p {
            font-size: 40px;
            color: #d4ff00;
        }

        /* Navigation */
        .nav-controls {
            position: fixed;
            bottom: 40px;
            right: 40px;
            display: flex;
            gap: 20px;
            z-index: 1000;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #0066ff;
            color: #ffffff;
            padding: 15px 30px;
            font-size: 18px;
            font-family: 'Space Mono', monospace;
            cursor: pointer;
            transition: all 0.3s;
        }

        .nav-btn:hover {
            background: #0066ff;
            transform: translateY(-2px);
        }

        .slide-counter {
            position: fixed;
            top: 40px;
            right: 40px;
            color: #d4ff00;
            font-size: 24px;
            font-weight: 700;
            z-index: 1000;
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>
<body>
    <div class="viewport-wrapper">
        <div class="presentation-stage">
            <!-- Slide 1: Title -->
            <div class="slide slide-1 active">
                <div class="content">
                    <h1>Frontend Slides</h1>
                    <div class="subtitle">测试演示</div>
                </div>
            </div>

            <!-- Slide 2: Features -->
            <div class="slide slide-2">
                <h2>核心特性</h2>
                <ul>
                    <li>零依赖单文件 HTML</li>
                    <li>固定 16:9 舞台</li>
                    <li>Anti-AI-Slop 设计</li>
                    <li>34 个大胆模板包</li>
                </ul>
            </div>

            <!-- Slide 3: Thank You -->
            <div class="slide slide-3">
                <div class="content">
                    <h2>测试成功！</h2>
                    <p>24k+ Stars on GitHub</p>
                </div>
            </div>
        </div>
    </div>

    <div class="slide-counter">
        <span id="current-slide">1</span> / <span id="total-slides">3</span>
    </div>

    <div class="nav-controls">
        <button class="nav-btn" id="prev-btn">← Prev</button>
        <button class="nav-btn" id="next-btn">Next →</button>
    </div>

    <script>
        let currentSlide = 0;
        const slides = document.querySelectorAll('.slide');
        const totalSlides = slides.length;
        const currentSlideSpan = document.getElementById('current-slide');
        const totalSlidesSpan = document.getElementById('total-slides');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');

        totalSlidesSpan.textContent = totalSlides;

        function showSlide(index) {
            slides.forEach(slide => slide.classList.remove('active'));
            slides[index].classList.add('active');
            currentSlideSpan.textContent = index + 1;
        }

        function nextSlide() {
            currentSlide = (currentSlide + 1) % totalSlides;
            showSlide(currentSlide);
        }

        function prevSlide() {
            currentSlide = (currentSlide - 1 + totalSlides) % totalSlides;
            showSlide(currentSlide);
        }

        nextBtn.addEventListener('click', nextSlide);
        prevBtn.addEventListener('click', prevSlide);

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') {
                e.preventDefault();
                nextSlide();
            } else if (e.key === 'ArrowLeft') {
                e.preventDefault();
                prevSlide();
            }
        });

        // Initialize
        showSlide(currentSlide);
    </script>
</body>
</html>
